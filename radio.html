<head>

<body>

<div class="sky"></div>

<main id="screen-landing" class="screen active">
  <div class="panel">
    <h1 class="title small">QUESTION FOUR</h1>
    <p class="sub">Tune in. Listen to the very first words of<br>INDUSTRY BABY by Lil Nas X ft. Jack Harlow.<br>Who's the producer that says his own name?</p>

    <div class="code-box">
      <div class="input-row">
        <input id="producer-input" class="code-input small" type="text" autocomplete="off" spellcheck="false" placeholder="name">
        <button id="producer-submit" class="mc-btn mc-btn-blue">SOLVE</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </div>

    <div id="unlock-box" class="puzzle-box hidden">
      <p class="puzzle-text">Access granted.</p>
      <a id="next-link" href="achievement.html" class="mc-btn mc-btn-green" style="text-decoration:none; display:inline-block;">NEXT QUESTION</a>
    </div>

    <a href="channel.html" class="skip-link">&larr; Back to the previous question</a>
  </div>
</main>

<script src="radio.js"></script>
</body>
</html>
