<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Stack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%233a7d1f%22/><rect x=%222%22 y=%222%22 width=%224%22 height=%224%22 fill=%22%235a4a3a%22/><rect x=%2210%22 y=%2210%22 width=%224%22 height=%224%22 fill=%22%235a4a3a%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>

<div class="sky"></div>

<main id="screen-landing" class="screen active">
  <div class="panel">
    <h1 class="title small">QUESTION TWO</h1>
    <p class="sub">Clear 3 lines to pass.</p>

    <div class="battle-ui">
      <span class="boss-name">STACK</span>
      <span class="quiz-score">Lines: <span id="lines-display">0</span> / 3</span>
    </div>

    <div class="battle-box-wrap">
      <canvas id="tetris-canvas" width="180" height="288"></canvas>
    </div>

    <div class="tetris-controls">
      <button id="btn-left" class="mc-btn mc-btn-blue">&#8592;</button>
      <button id="btn-rotate" class="mc-btn mc-btn-blue">&#8635;</button>
      <button id="btn-down" class="mc-btn mc-btn-blue">&#8595;</button>
      <button id="btn-right" class="mc-btn mc-btn-blue">&#8594;</button>
    </div>

    <p id="battle-status" class="feedback">Arrow keys or the buttons above. Space to hard-drop.</p>

    <div id="death-box" class="puzzle-box hidden">
      <p class="puzzle-text you-died">TOPPED OUT</p>
      <button id="retry-btn" class="mc-btn mc-btn-blue">RETRY</button>
    </div>

    <div id="unlock-box" class="puzzle-box hidden">
      <p class="puzzle-text">Access granted.</p>
      <a id="next-link" href="channel.html" class="mc-btn mc-btn-green" style="text-decoration:none; display:inline-block;">NEXT QUESTION</a>
    </div>

    <a href="spawn.html" class="skip-link">&larr; Back to the previous question</a>
  </div>
</main>

<script src="roblox.js"></script>
</body>
</html>
