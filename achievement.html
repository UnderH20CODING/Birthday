<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Fragment</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%233a7d1f%22/><rect x=%222%22 y=%222%22 width=%224%22 height=%224%22 fill=%22%235a4a3a%22/><rect x=%2210%22 y=%2210%22 width=%224%22 height=%224%22 fill=%22%235a4a3a%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>

<div class="sky"></div>

<main id="screen-landing" class="screen active">
  <div class="panel">
    <div class="achievement locked" id="achievement-card">
      <span class="achievement-icon">?</span>
      <div>
        <div class="achievement-title">Achievement Locked</div>
        <div class="achievement-sub">Sync required</div>
      </div>
    </div>

    <h1 class="title small" style="margin-top:20px;">SYNC THE SPAWNPOINT</h1>
    <p class="sub">To restore the final fragment, enter the date<br>this legend respawns every year.</p>

    <div class="code-box">
      <div class="input-row">
        <input id="date-input" class="code-input small" type="text" autocomplete="off" spellcheck="false" placeholder="month + day">
        <button id="date-submit" class="mc-btn mc-btn-blue">SYNC</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </div>

    <div id="unlock-box" class="puzzle-box hidden">
      <p class="puzzle-text">Code recovered: <span class="hl" id="code-reveal"></span></p>
      <a id="return-link" href="index.html" class="mc-btn mc-btn-green" style="text-decoration:none; display:inline-block;">GO ENTER THE CODE</a>
    </div>

    <a href="spawn.html" class="skip-link">&larr; Back to the previous signal</a>
  </div>
</main>

<script src="achievement.js"></script>
</body>
</html>
